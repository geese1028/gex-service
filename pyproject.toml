[project]
name = "gex-service"
version = "0.5.0"
description = "IBKR-backed gamma exposure service: GEX, walls, DEX/VEX/CEX, scenarios, IV surface, scan, flow, alerts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "httpx>=0.28.1",
    "nautilus-trader[ib]>=1.221.0",
]

[project.scripts]
gex-service = "gex_service.main:run"
gex-export = "gex_service.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gex_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
